<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Little Café</title>
<style>
:root{--br:#6b4a3a;--br2:#8a6350;--pk:#f4a6bd;--pk2:#ee7d9f;--cr:#fff6ea;--ln:#ead9c6;--gn:#74c04a;--ink:#4a3029}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#7cc844;color:var(--ink);font-family:Arial,"Helvetica Neue",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
#wr{position:absolute;top:60px;right:12px;width:34px;height:34px;border-radius:9px;border:2px solid #fff;background:#f4a6bd;font-size:16px;padding:0;box-shadow:0 2px 5px #0005}
#nbr{position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(#f6ead8,#e9d6bb);border-top:3px solid #fff;display:flex;gap:8px;padding:7px 10px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;box-shadow:0 -3px 10px #0004}
.nb{flex:none;width:86px;background:#fff;border:2px solid #d9c3a5;border-radius:12px;position:relative;text-align:center;padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nb.you{border-color:var(--pk2);background:#fff4f8}
.nb .rk{position:absolute;left:-2px;top:-2px;background:var(--br);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px 0 8px 0}
.nb .av2{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px #0004;margin-top:6px}
.nb .lv2{position:absolute;right:4px;top:18px;width:19px;height:19px;border-radius:50%;background:#6fc4a0;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.nb b{font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb button{border:0;border-radius:7px;background:var(--gn);color:#fff;font-weight:700;font-size:10px;padding:2px 12px;box-shadow:0 2px 0 #4d8f2c}
.nb.you button{background:#cfc2b2;box-shadow:0 2px 0 #b3a591}
.stripe{background:repeating-linear-gradient(-45deg,#f6a9c1 0 7px,#fcd3e0 7px 14px)}
#hudL{position:absolute;top:6px;left:6px;width:min(250px,62vw);background:#fff;border-radius:14px;box-shadow:0 2px 8px #0004;padding:7px 9px 7px 7px;display:flex;gap:8px;align-items:center;cursor:pointer}
#avc{width:46px;height:50px;border-radius:8px;background:#f7e3d3;flex:none;display:block}
.lvc{position:absolute;left:4px;top:36px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--br);font-size:12px;font-weight:700;display:grid;place-items:center}
.hl{flex:1;min-width:0}
.xb{position:relative;height:18px;border-radius:9px;background:var(--br);overflow:hidden;border:2px solid var(--br)}
.xb i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;transition:width .5s}
.xb span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 1px #0008}
.cn{margin-top:4px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.coin{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f2b82a 60%,#c98a12);border:1.5px solid #b97a0b;display:inline-block}
.cn.bump .coin{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.4)}}
#hudR{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:8px}
#cname{font-weight:700;font-size:14px;color:#5b2d3d;background:#fbd0de;border:3px solid #fff;border-radius:16px;padding:3px 12px;box-shadow:0 2px 6px #0004;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#emb{width:48px;height:48px;border-radius:50%;border:4px solid var(--br);background:#fff1dc;padding:0;display:grid;place-items:center;box-shadow:0 2px 6px #0005}
#amb{position:absolute;top:66px;right:54px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #0008}
#rail{position:absolute;left:8px;top:84px;display:flex;flex-direction:column;gap:12px}
.gb{position:relative;width:50px;height:50px;border:0;background:none;padding:0;font-size:36px;filter:drop-shadow(0 2px 2px #0005)}
.gb.rdy{animation:wig 1.2s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}}
.gb small{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;background:#fff;border-radius:8px;font-size:10px;font-weight:700;padding:1px 5px;white-space:nowrap;font-family:Arial}
.gb .bd{position:absolute;top:-2px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#ee4d6d;color:#fff;font-size:12px;font-weight:700;display:none;place-items:center;padding:0 4px;border:2px solid #fff;font-family:Arial}
.gb .bd.on{display:grid}
#bl{position:absolute;left:8px;bottom:88px;display:flex;gap:8px}
.rb{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 25%,#fdd3df,#f08fae 70%);box-shadow:0 3px 6px #0005;font-size:26px;display:grid;place-items:center;padding:0;transition:transform .1s}
.rb:active{transform:scale(.9)}
#zoom{position:absolute;right:10px;bottom:92px;display:flex;flex-direction:column;gap:6px}
.zb{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 25%,#b9ec8e,#58ad32 75%);color:#fff;font-size:22px;font-weight:700;line-height:1;box-shadow:0 2px 5px #0005;padding:0}
#tip{position:absolute;left:12px;right:56px;bottom:152px;pointer-events:none;display:flex;justify-content:center}
#tip span{background:#fff;border-radius:14px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 8px #0005;border:2px solid var(--pk);max-width:100%;text-align:center}
#tip:empty{display:none}
#toast{position:absolute;left:0;right:0;top:100px;text-align:center;pointer-events:none}
#toast span{display:inline-block;background:#6b4a3af0;color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;animation:tin .25s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#modal{position:absolute;inset:0;background:#2a1a1288;display:none;align-items:center;justify-content:center;padding:12px;touch-action:none}
#modal.on{display:flex}
.sheet{background:var(--cr);border-radius:16px;width:min(100%,470px);max-height:92%;display:flex;flex-direction:column;box-shadow:0 10px 36px #0007;animation:pop .2s;overflow:hidden;border:3px solid var(--br)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.hd{background:var(--br);color:#fff;display:flex;align-items:center;padding:9px 12px;font-weight:700;font-size:18px}
.hd span{flex:1}
.x{width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--pk2);color:#fff;font-weight:700;font-size:14px;padding:0}
.sb{padding:10px;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:9px}
.tabs{display:flex;gap:5px;padding:8px 10px 0;background:#f3e4cf}
.tab{flex:1;border:0;border-radius:10px 10px 0 0;padding:8px 2px;font-weight:700;font-size:13px;background:#e4cfb3;color:var(--br2)}
.tab.on{background:var(--cr);color:var(--br)}
.rc{display:flex;gap:10px;background:#fff;border:2px solid var(--ln);border-radius:10px;padding:8px 10px;cursor:pointer}
.rc.lock{opacity:.65}
.rc .l{flex:1;min-width:0}
.rc h4{margin:0 0 5px;font-family:Georgia,serif;font-size:15px;color:var(--br);text-align:center;border-bottom:1px solid var(--ln);padding-bottom:3px}
.tag{display:inline-block;background:var(--pk);color:#5b2d3d;font-weight:700;font-size:13px;padding:2px 14px 2px 8px;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);margin-bottom:4px}
.rc .ln{font-size:12px;color:var(--ink);display:flex;align-items:center;gap:5px;margin:2px 0}
.rc .ln b{color:#b5651d}
.ico{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.ico.clk{background:#fff;border:2px solid #e8993f}
.ico.cn2{background:radial-gradient(circle at 35% 30%,#fff3a0,#f2b82a 60%,#c98a12);border:1.5px solid #b97a0b}
.rc .r{width:96px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px}
.rc .pic{position:relative;width:64px;height:64px}
.rc .pic .sv{position:absolute;right:-8px;bottom:-2px;background:var(--pk2);color:#fff;font-weight:700;font-size:12px;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;border:2px solid #fff}
.go{border:0;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;background:var(--gn);color:#fff;box-shadow:0 2px 0 #4d8f2c}
.go.no{background:#cfc2b2;box-shadow:0 2px 0 #b3a591}
.go.own{background:none;box-shadow:none;color:var(--gn)}
.av{font-size:13px;font-weight:700;color:#4d9b2a}
.av.lv{color:var(--ink)}
.it{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ln);border-radius:10px;padding:8px 10px}
.it .ic{width:50px;height:50px;border-radius:10px;background:#fbf0e1;display:grid;place-items:center;font-size:28px;flex:none}
.it .tx{flex:1;min-width:0}.it .tx b{font-size:14px;display:block}.it .tx small{color:#9a7b66;font-size:12px;display:block;line-height:1.25}
.it .go{min-width:78px}
.it.lock{opacity:.6}
.bar{height:10px;background:var(--br);border-radius:6px;margin-top:6px;overflow:hidden;border:1px solid var(--br)}
.bar i{display:block;height:100%}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:60px;height:60px;border-radius:12px;border:3px solid #fff;box-shadow:0 2px 4px #0004;position:relative;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000a;padding:0}
.sw button.sel{outline:3px solid var(--pk2)}.sw button small{position:absolute;bottom:2px;left:0;right:0}
.sw.round button{border-radius:50%;width:44px;height:44px}
.lab{font-weight:700;font-size:14px;color:var(--br)}
.stp{padding:16px;text-align:center}
.stp .ph{font-size:12px;color:#9a7b66;letter-spacing:1px;text-transform:uppercase}
.stp .big{width:130px;height:130px;margin:12px auto;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 35% 25%,#fdd3df,#f08fae 75%);box-shadow:0 5px 0 #c9668a,0 8px 14px #0004;font-size:60px;display:grid;place-items:center;padding:0;transition:transform .06s}
.stp .big.sq{transform:scale(.92)}
.stp .lb{font-weight:700;font-size:18px;color:var(--br);margin:6px 0 0;min-height:24px}
.stp .pb{height:16px;border-radius:8px;background:var(--br);border:2px solid var(--br);overflow:hidden;max-width:260px;margin:0 auto}
.stp .pb i{display:block;height:100%;width:0;transition:width .12s;border-radius:6px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots b{width:10px;height:10px;border-radius:50%;background:#e4cfb3}.dots b.on{background:var(--pk2)}
.center{text-align:center;padding:18px 18px 20px}
.center h1{margin:2px 0;font-family:Georgia,serif;color:var(--br);font-size:30px}
.center p{color:#9a7b66;margin:6px 0 14px;line-height:1.4;font-size:14px}
.pbtn{border:0;border-radius:12px;padding:12px 26px;font-weight:700;font-size:17px;background:var(--pk2);color:#fff;box-shadow:0 4px 0 #c9668a}
.pbtn:active{transform:translateY(2px)}
.inp{width:100%;border:3px solid var(--ln);border-radius:10px;padding:10px;font:inherit;font-weight:700;font-size:15px;text-align:center;background:#fff;color:var(--ink);margin-bottom:12px;user-select:text;-webkit-user-select:text}
.unl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.unl div{background:#fff;border:2px solid var(--ln);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.logo{font-family:Georgia,"Brush Script MT",cursive;font-style:italic;font-size:44px;font-weight:700;line-height:1;color:var(--br);text-shadow:2px 2px 0 #fff}
.logo i{color:var(--pk2)}
</style>

// ---- Neighbors leaderboard (bottom strip) ----
const NB = ["Mia", "Leo", "Nora", "Sam", "Zoe", "Omar", "Lina", "Kai", "Ava", "Yusuf", "Ella", "Noah"], NBC = ["#e8508a", "#4fa6c9", "#6fb04f", "#e8923a", "#9f7bd6", "#d94a4a", "#3a9d8f", "#c8932a", "#c05a8f", "#5b78d8", "#e07a5f", "#5f8f45"];
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
function neighbors() {
  const day = Math.floor(now() / 864e5), arr = NB.map((n, i) => ({ n, i, lv: Math.max(1, Math.round(2 + i * 1.05 + Math.sin(day * .9 + i * 1.7) * 2.2)), you: false }));
  arr.forEach(a => { a.sc = a.lv * 1000 + ((a.i * 173 + day * 37) % 900); }); arr.push({ n: "You", i: -1, lv: S.level, sc: S.level * 1000 + S.xp, you: true }); arr.sort((a, b) => b.sc - a.sc); return arr;
}
let nbSig = "";
function renderNeighbors() {
  const list = neighbors(), vis = S.visits || {}, sig = list.map(a => a.n + a.lv).join() + "|" + S.xp + "|" + Object.values(vis).map(v => now() - v < 600000 ? 1 : 0).join("");
  if (sig === nbSig) return; const first = !nbSig; nbSig = sig; const el = $("nbr"), keep = el.scrollLeft; el.innerHTML = "";

    const d = document.createElement("div"), done = !a.you && now() - (vis[a.n] || 0) < 600000; d.className = "nb" + (a.you ? " you" : "");
    d.innerHTML = '<span class="rk">' + ord(r + 1) + '</span><div class="av2" style="background:' + (a.you ? "#ee7d9f" : NBC[a.i]) + '">' + (a.you ? "★" : a.n[0]) + '</div><span class="lv2">' + a.lv + '</span><b>' + (a.you ? "You" : a.n) + '</b><button>' + (a.you ? "YOU" : done ? "✔" : "VISIT") + '</button>';

    }; el.appendChild(d);

}
